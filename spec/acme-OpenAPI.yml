openapi: 3.0.3

info:
  title: ACME Training API
  description: |
    Production-grade training API used to demonstrate
    OpenAPI-first design, contract testing, security testing,
    and Playwright API automation.
  version: 1.0.0

servers:
  - url: http://localhost:3000/api/v1
    description: Local development
  - url: https://api.acme-training.com/api/v1
    description: Production

tags:
  - name: Auth
  - name: Users
  - name: Documents
  - name: System

# ---------------------------------------------------
# SECURITY
# ---------------------------------------------------
security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      schema:
        type: string
      description: Correlation ID for tracing requests

    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1

    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10

  # ---------------------------------------------------
  # SCHEMAS
  # ---------------------------------------------------
  schemas:

    # ---------- AUTH ----------
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    LoginResponse:
      type: object
      required: [accessToken, role, expiresIn]
      properties:
        accessToken:
          type: string
        role:
          type: string
          enum: [ADMIN, MANAGER, USER]
        expiresIn:
          type: integer
          example: 3600

    # ---------- USERS ----------
    CreateUserRequest:
      type: object
      required: [name, email]
      properties:
        name:
          type: string
          minLength: 2
        email:
          type: string
          format: email

    User:
      type: object
      required: [id, name, email, role, status, createdAt]
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [ADMIN, MANAGER, USER]
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
        createdAt:
          type: string
          format: date-time

    PagedUsers:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/User'
        pagination:
          $ref: '#/components/schemas/Pagination'

    Pagination:
      type: object
      required: [page, limit, total]
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer

    # ---------- DOCUMENTS ----------
    Document:
      type: object
      required: [id, fileName, mimeType, size, uploadedBy, status]
      properties:
        id:
          type: string
        fileName:
          type: string
        mimeType:
          type: string
        size:
          type: integer
        uploadedBy:
          type: string
        status:
          type: string
          enum: [UPLOADED, PROCESSED]

    # ---------- ERROR ----------
    ErrorResponse:
      type: object
      required:
        - timestamp
        - status
        - error
        - message
        - path
        - correlationId
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
        error:
          type: string
        message:
          type: string
        path:
          type: string
        correlationId:
          type: string

# ---------------------------------------------------
# PATHS
# ---------------------------------------------------
paths:

  # ---------- SYSTEM ----------
  /health:
    get:
      tags: [System]
      summary: Health check
      security: []
      responses:
        '200':
          description: Service healthy

  # ---------- AUTH ----------
  /auth/login:
    post:
      tags: [Auth]
      summary: Login and receive JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ---------- USERS ----------
  /users:
    post:
      tags: [Users]
      summary: Create user (ADMIN only)
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden

    get:
      tags: [Users]
      summary: List users (ADMIN, MANAGER)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Users list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedUsers'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden

  /users/{id}:
    get:
      tags: [Users]
      summary: Get user by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found

    delete:
      tags: [Users]
      summary: Delete user (ADMIN only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: User deleted
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found

  # ---------- DOCUMENTS ----------
  /documents:
    post:
      tags: [Documents]
      summary: Upload document
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                documentType:
                  type: string
                referenceId:
                  type: string
      responses:
        '201':
          description: Document uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400':
          description: Invalid upload
        '401':
          description: Unauthorized
        '413':
          description: File too large
        '415':
          description: Unsupported media type

  /documents/{id}/download:
    get:
      tags: [Documents]
      summary: Download document
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: File stream
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
